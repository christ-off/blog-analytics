AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFront standard logging (v2) delivery to S3 for the blog distribution.
  Must be deployed in us-east-1 (CloudWatch Logs vended log delivery for CloudFront).
  Adopted from the console-created resources with a CloudFormation import,
  see import-cloudfront-logging.sh.

Parameters:
  DistributionId:
    Type: String
    Description: CloudFront distribution ID
  LogsBucket:
    Type: String
    Description: S3 bucket receiving the logs
  DeliveryDestinationName:
    Type: String
    Description: Name of the existing delivery destination (generated by the console)

Resources:
  LogDeliverySource:
    Type: AWS::Logs::DeliverySource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'CreatedByCloudFront-${DistributionId}'
      LogType: ACCESS_LOGS
      ResourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

  LogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DeliveryDestinationName
      # OutputFormat can't be changed after creation
      OutputFormat: w3c
      DestinationResourceArn: !Sub 'arn:aws:s3:::${LogsBucket}'

  LogDelivery:
    Type: AWS::Logs::Delivery
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeliverySourceName: !Ref LogDeliverySource
      DeliveryDestinationArn: !GetAtt LogDeliveryDestination.Arn
      FieldDelimiter: "\t"
      S3SuffixPath: 'AWSLogs/{account-id}/CloudFront/'
      S3EnableHiveCompatiblePath: false
      # Order matters: it is the column order of the w3c files.
      # blog-analytics and analyze-logs map columns by name from #Fields:.
      RecordFields:
        - "date"
        - "time"
        - "x-edge-location"
        - "sc-bytes"
        - "c-ip"
        - "cs-method"
        - "cs(Host)"
        - "cs-uri-stem"
        - "sc-status"
        - "cs(Referer)"
        - "cs(User-Agent)"
        - "cs-uri-query"
        - "cs(Cookie)"
        - "x-edge-result-type"
        - "x-edge-request-id"
        - "x-host-header"
        - "cs-protocol"
        - "cs-bytes"
        - "time-taken"
        - "x-forwarded-for"
        - "ssl-protocol"
        - "ssl-cipher"
        - "x-edge-response-result-type"
        - "cs-protocol-version"
        - "fle-status"
        - "fle-encrypted-fields"
        - "c-port"
        - "time-to-first-byte"
        - "x-edge-detailed-result-type"
        - "sc-content-type"
        - "sc-content-len"
        - "sc-range-start"
        - "sc-range-end"
        - "c-country"
        - "asn"
